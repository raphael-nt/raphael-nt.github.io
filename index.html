<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iRAP Robot Club</title>
<meta name="description" content="Tools for iRAP robotics activities">
<link rel="icon" href="shared/irap-icon.png">
<style>
@font-face{font-family:"IBM Plex Sans Thai";font-weight:400;font-display:swap;src:url(shared/fonts/plexthai-400.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Thai";font-weight:600;font-display:swap;src:url(shared/fonts/plexthai-600.woff2) format("woff2")}
:root{--ink:#16191B;--floor:#E7EAE8;--panel:#FFFFFF;--line:#C9CFCC;--muted:#5D6663;--teal:#00878F;--tape:#F2B705;--r-md:10px;
  --f:"IBM Plex Sans Thai",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--floor);color:var(--ink);font:400 16px/1.5 var(--f)}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
main{width:min(560px,100%);display:grid;gap:14px}
header{display:flex;align-items:center;gap:14px;margin-bottom:6px}
header img{height:48px}
h1{margin:0;font-weight:600;font-size:26px;line-height:1.25}
a.pick{display:grid;gap:2px;padding:18px 20px;background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:var(--r-md);color:inherit;text-decoration:none}
a.pick:hover{border-color:var(--ink);border-left-color:var(--c)}
a.pick:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
a.pick b{font-size:22px;font-weight:600}
a.pick span{color:var(--muted)}
.vex{--c:var(--tape)} .alvik{--c:var(--teal)}
main{position:relative;z-index:1}
/* robot line art from the iRAP shirt set, faint in the corners */
.art{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.art img{position:absolute;opacity:.13;height:auto}
.art .w{display:none}
.a1{width:min(46vw,520px);left:-4vw;bottom:-3vh}
.a2{width:min(34vw,400px);right:-3vw;top:-4vh;transform:rotate(-8deg)}
.a3{width:min(14vw,160px);right:5vw;bottom:4vh}
@media (max-width:640px){.a1{width:80vw;left:-18vw;bottom:-4vh}.a2{width:60vw;right:-16vw;top:-3vh}.a3{display:none!important}}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#E8ECEA;--floor:#141718;--panel:#1E2224;--line:#3A4144;--muted:#A3ACA9}
  :root:not([data-theme="light"]) .art .b{display:none}
  :root:not([data-theme="light"]) .art .w{display:block}
}
:root[data-theme="dark"] .art .b{display:none}
:root[data-theme="dark"] .art .w{display:block}
:root[data-theme="dark"]{--ink:#E8ECEA;--floor:#141718;--panel:#1E2224;--line:#3A4144;--muted:#A3ACA9}
</style>
</head>
<body>
<div class="art" aria-hidden="true">
<img class="a1 b" src="shared/art/legged_line_black.png" alt=""><img class="a1 w" src="shared/art/legged_line_white.png" alt="">
<img class="a2 b" src="shared/art/rescue_line_sketch_black.png" alt=""><img class="a2 w" src="shared/art/rescue_line_sketch_white.png" alt="">
<img class="a3 b" src="shared/art/service_line_black.png" alt=""><img class="a3 w" src="shared/art/service_line_white.png" alt="">
</div>
<main>
<header><img src="shared/irap.png" alt="iRAP"><h1>iRAP Robot Club</h1></header>
<a class="pick vex" href="vex-go-builder/"><b>VEX GO Builder</b><span>ประกอบหุ่น VEX GO แบบ 3D ดูขั้นตอนประกอบ และหมุนดูโมเดล</span></a>
<a class="pick alvik" href="alvik-match-control/"><b>Alvik Match Control</b><span>ระบบจัดการแข่ง Arduino Alvik ทั้ง Admin, Dashboard และ Referee</span></a>
</main>
</body>
</html>
