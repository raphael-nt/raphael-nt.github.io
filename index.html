<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iRAP Robot Club</title>
<meta name="description" content="Tools for iRAP robotics activities">
<link rel="icon" href="shared/irap-icon.png">
<style>
@font-face{font-family:"IBM Plex Sans Thai";font-weight:400;font-display:swap;src:url(shared/fonts/plexthai-400.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Thai";font-weight:600;font-display:swap;src:url(shared/fonts/plexthai-600.woff2) format("woff2")}
:root{--ink:#16191B;--floor:#E7EAE8;--panel:#FFFFFF;--line:#C9CFCC;--muted:#5D6663;--teal:#00878F;--tape:#F2B705;--r-md:10px;
  --f:"IBM Plex Sans Thai",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--floor);color:var(--ink);font:400 16px/1.5 var(--f)}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
main{width:min(560px,100%);display:grid;gap:14px}
header{display:flex;align-items:center;gap:14px;margin-bottom:6px}
header img{height:48px}
h1{margin:0;font-weight:600;font-size:26px;line-height:1.25}
a.pick{display:flex;align-items:center;gap:16px;padding:14px 18px 14px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.pick:hover{border-color:var(--c);transform:translateY(-1px)}
a.pick:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
a.pick .ic{flex:none;width:48px;height:48px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
a.pick .ic svg{width:26px;height:26px}
a.pick b{flex:1;font-size:20px;font-weight:600;line-height:1.3}
a.pick .go{flex:none;width:18px;height:18px;color:var(--muted)}
a.pick:hover .go{color:var(--c)}
.vex{--c:#C99700} .alvik{--c:var(--teal)} .timer{--c:#1479C9} .sim{--c:#7A4FD0}
.social{position:fixed;right:16px;bottom:16px;z-index:2;display:flex;gap:8px}
.social a{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--ink);transition:border-color .15s,color .15s}
.social a:hover{border-color:var(--teal);color:var(--teal)}
.social a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.social svg{width:20px;height:20px}
@media (max-width:640px){body{padding-bottom:84px}}
main{position:relative;z-index:1}
/* robot line art from the iRAP shirt set, faint in the corners */
.art{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.art img{position:absolute;opacity:.13;height:auto}
.art .w{display:none}
.a1{width:min(46vw,520px);left:-4vw;bottom:-3vh}
.a2{width:min(34vw,400px);right:-3vw;top:-4vh;transform:rotate(-8deg)}
.a3{width:min(14vw,160px);right:5vw;bottom:4vh}
@media (max-width:640px){.a1{width:80vw;left:-18vw;bottom:-4vh}.a2{width:60vw;right:-16vw;top:-3vh}.a3{display:none!important}}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#E8ECEA;--floor:#141718;--panel:#1E2224;--line:#3A4144;--muted:#A3ACA9}
  :root:not([data-theme="light"]) .art .b{display:none}
  :root:not([data-theme="light"]) .art .w{display:block}
}
:root[data-theme="dark"] .art .b{display:none}
:root[data-theme="dark"] .art .w{display:block}
:root[data-theme="dark"]{--ink:#E8ECEA;--floor:#141718;--panel:#1E2224;--line:#3A4144;--muted:#A3ACA9}
</style>
</head>
<body>
<div class="art" aria-hidden="true">
<img class="a1 b" src="shared/art/legged_line_black.png" alt=""><img class="a1 w" src="shared/art/legged_line_white.png" alt="">
<img class="a2 b" src="shared/art/rescue_line_sketch_black.png" alt=""><img class="a2 w" src="shared/art/rescue_line_sketch_white.png" alt="">
<img class="a3 b" src="shared/art/service_line_black.png" alt=""><img class="a3 w" src="shared/art/service_line_white.png" alt="">
</div>
<main>
<header><img src="shared/irap-full.png" alt="iRAP"><h1>iRAP Robot Club</h1></header>
<a class="pick vex" href="vex-go-builder/"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/><rect x="8" y="3" width="8" height="8" rx="1"/></svg></span><b>VEX GO Builder</b><svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
<a class="pick timer" href="vex-unofficial-timer/"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6M12 2v3"/></svg></span><b>VEX Unofficial Timer</b><svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
<a class="pick alvik" href="alvik-match-control/"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M9 17h6"/></svg></span><b>Arduino Day : Alvik Match Control</b><svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
<a class="pick sim" href="arduino-alvik-sim/"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M2 13v2M22 13v2"/><circle cx="12" cy="3.5" r="1"/></svg></span><b>Alvik Simulation</b><svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
</main>
<nav class="social" aria-label="iRAP social media">
<a href="https://www.facebook.com/iraprobot" target="_blank" rel="noopener" aria-label="Facebook" title="Facebook"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.6-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.9v3h2.6V21z"/></svg></a>

<a href="https://www.tiktok.com/@iraprobot" target="_blank" rel="noopener" aria-label="TikTok" title="TikTok"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 3c.4 2 1.7 3.4 3.9 3.6v3a7 7 0 0 1-3.9-1.2v6.3a5.8 5.8 0 1 1-5.8-5.8c.3 0 .6 0 .9.1v3.1a2.8 2.8 0 1 0 1.9 2.6V3z"/></svg></a>
</nav>
</body>
</html>
